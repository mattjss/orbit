<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>orbit</title>
  <style>
    :root { --sz: 100vmin; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-family: system-ui, sans-serif; cursor: none;
    }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    canvas {
      width: var(--sz); height: var(--sz);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); display: block;
    }
    #meta { display: flex; align-items: center; gap: 24px; }
    #label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="meta">
      <span id="label">orbit — move + click</span>
    </div>
  </div>
<script>
  const SZ      = 422;
  const G       = 3200000; // fast orbits: ~1.2s inner, ~6s outer
  const TRAIL   = 54;
  const MIN_R   = 8;
  const CURSOR_R = 22; // physical deflection radius

  // Three distinct rings: [count, rMin, rMax, hue]
  const RINGS = [
    [85,  38,  62,  36],  // inner — amber/orange
    [90,  80, 108, 172],  // middle — teal/cyan
    [85, 125, 158, 268],  // outer — violet/indigo
  ];

  const canvas = document.getElementById('c');
  canvas.width = canvas.height = SZ;
  const ctx = canvas.getContext('2d');

  let mx = SZ/2, my = SZ/2, isInside = false;
  let cvx = 0, cvy = 0; // cursor velocity (pixels per frame)

  // Spring-following gravity center
  let gx = SZ/2, gy = SZ/2, gvx = 0, gvy = 0;

  function gauss() {
    let u, v;
    do { u = Math.random(); } while (u === 0);
    do { v = Math.random(); } while (v === 0);
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  const particles = [];

  function spawnInRing(cx, cy, rMin, rMax, hue) {
    const r    = rMin + Math.random() * (rMax - rMin);
    const ang  = Math.random() * Math.PI * 2;
    const x    = cx + Math.cos(ang) * r;
    const y    = cy + Math.sin(ang) * r;
    const orbV = Math.sqrt(G / r) * (0.92 + Math.random() * 0.16);
    const dir  = Math.random() < 0.06 ? -1 : 1;
    particles.push({
      x, y,
      vx: -Math.sin(ang) * orbV * dir + gauss() * 1.8,
      vy:  Math.cos(ang) * orbV * dir + gauss() * 1.8,
      trail: [],
      hue,
      rMin, rMax, // for respawn
    });
  }

  RINGS.forEach(([count, rMin, rMax, hue]) => {
    for (let i = 0; i < count; i++) spawnInRing(SZ/2, SZ/2, rMin, rMax, hue);
  });

  const waves = [];
  let flashAlpha = 0;

  // ── Events ──────────────────────────────────────────────────────
  canvas.addEventListener('mousemove', e => {
    const r  = canvas.getBoundingClientRect();
    const nx = (e.clientX - r.left) * (SZ / r.width);
    const ny = (e.clientY - r.top)  * (SZ / r.height);
    cvx = nx - mx; cvy = ny - my;
    mx = nx; my = ny;
    isInside = true;
  });
  canvas.addEventListener('mouseenter', () => isInside = true);
  canvas.addEventListener('mouseleave', () => { isInside = false; cvx = 0; cvy = 0; });

  canvas.addEventListener('pointerdown', e => {
    const r  = canvas.getBoundingClientRect();
    const ex = (e.clientX - r.left) * (SZ / r.width);
    const ey = (e.clientY - r.top)  * (SZ / r.height);
    particles.forEach(p => {
      const dx = p.x - ex, dy = p.y - ey;
      const d  = Math.sqrt(dx*dx + dy*dy) + 1;
      p.vx += (dx/d) * (34000 / d);
      p.vy += (dy/d) * (34000 / d);
    });
    waves.push({ x: ex, y: ey, r: 0, born: 0 });
    flashAlpha = 0.22;
    playClick();
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    mx = (t.clientX - r.left) * (SZ / r.width);
    my = (t.clientY - r.top)  * (SZ / r.height);
    isInside = true;
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    const nx = (t.clientX - r.left) * (SZ / r.width);
    const ny = (t.clientY - r.top)  * (SZ / r.height);
    cvx = nx - mx; cvy = ny - my;
    mx = nx; my = ny;
  }, { passive: false });
  canvas.addEventListener('touchend', () => { isInside = false; cvx = 0; cvy = 0; });

  // ── Update ──────────────────────────────────────────────────────
  function update(dt) {
    const tx = isInside ? mx : SZ/2;
    const ty = isInside ? my : SZ/2;
    gvx += (tx - gx) * 0.08;
    gvy += (ty - gy) * 0.08;
    gvx *= 0.76; gvy *= 0.76;
    gx  += gvx * dt * 60;
    gy  += gvy * dt * 60;

    const cspd = Math.sqrt(cvx*cvx + cvy*cvy);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      // Gravity toward center
      const dx = gx - p.x, dy = gy - p.y;
      const d  = Math.max(Math.sqrt(dx*dx + dy*dy), MIN_R);
      p.vx += (dx/d) * (G / (d * d)) * dt;
      p.vy += (dy/d) * (G / (d * d)) * dt;

      if (isInside) {
        const pdx = p.x - mx, pdy = p.y - my;
        const pd  = Math.sqrt(pdx*pdx + pdy*pdy);

        // Physical deflection: cursor has mass
        if (pd < CURSOR_R && pd > 0) {
          const push = (CURSOR_R - pd) / CURSOR_R;
          p.vx += (pdx/pd) * push * 1400 * dt;
          p.vy += (pdy/pd) * push * 1400 * dt;
        }

        // Velocity wake: fast swipes sling nearby particles
        if (cspd > 1.5 && pd < 115) {
          const wake = (1 - pd/115) * Math.min(cspd / 14, 1.8);
          p.vx += cvx * wake * 1.3 * dt * 60;
          p.vy += cvy * wake * 1.3 * dt * 60;
        }
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > TRAIL) p.trail.shift();

      if (p.x < -SZ || p.x > SZ*2 || p.y < -SZ || p.y > SZ*2) {
        const { rMin, rMax, hue } = p;
        particles.splice(i, 1);
        spawnInRing(gx, gy, rMin, rMax, hue);
      }
    }

    for (let i = waves.length - 1; i >= 0; i--) {
      waves[i].born += dt;
      waves[i].r    += 295 * dt;
      if (waves[i].r > SZ * 1.5) waves.splice(i, 1);
    }

    flashAlpha *= 0.83;
    cvx *= 0.76; cvy *= 0.76;
  }

  // ── Draw ────────────────────────────────────────────────────────
  function draw() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SZ, SZ);

    // Click flash
    if (flashAlpha > 0.004) {
      ctx.fillStyle = `rgba(255,245,225,${flashAlpha.toFixed(3)})`;
      ctx.fillRect(0, 0, SZ, SZ);
    }

    // Additive blending from here — colors stack into glow
    ctx.globalCompositeOperation = 'screen';

    // Core glow
    const grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, 58);
    grd.addColorStop(0,    'rgba(255,230,180,0.32)');
    grd.addColorStop(0.38, 'rgba(255,160,70,0.10)');
    grd.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(gx, gy, 58, 0, Math.PI*2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Shockwave ring
    waves.forEach(w => {
      const a = Math.max(0, 0.62 * (1 - w.born * 1.15));
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,210,140,${a.toFixed(3)})`;
      ctx.lineWidth = 1.8;
      ctx.stroke();
    });

    // Particles + trails
    particles.forEach(p => {
      const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
      const hot   = Math.min(speed / 320, 1);
      const { hue } = p;

      const len = p.trail.length;
      for (let j = 0; j < len; j++) {
        const frac = (j + 1) / len;
        const pt   = p.trail[j];
        const a    = frac * frac * frac * 0.58;
        const l    = 14 + frac * (32 + hot * 38);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 0.45 + frac * 1.15, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${hue},85%,${l.toFixed(0)}%,${a.toFixed(3)})`;
        ctx.fill();
      }

      const hl = 52 + hot * 43;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.4 + hot * 0.95, 0, Math.PI*2);
      ctx.fillStyle = `hsl(${hue},88%,${hl.toFixed(0)}%)`;
      ctx.fill();
    });

    // Star dot
    ctx.beginPath();
    ctx.arc(gx, gy, 3.2, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,242,215,0.92)';
    ctx.fill();

    // Cursor dot
    if (isInside && Math.hypot(mx - gx, my - gy) > 8) {
      ctx.beginPath();
      ctx.arc(mx, my, 1.8, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.42)';
      ctx.fill();
    }
  }

  // ── Audio ────────────────────────────────────────────────────────
  let clickAudio = null;
  function initAudio() {
    if (clickAudio) return;
    clickAudio = new Audio('./sounds/selection.mp3');
    clickAudio.volume = 0.42;
  }
  function playClick() {
    initAudio();
    clickAudio.currentTime = 0;
    clickAudio.play().catch(() => {});
  }

  // ── Loop ─────────────────────────────────────────────────────────
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
