<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>orbit</title>
  <style>
    :root { --sz: 422px; }
    @media (min-width: 1440px) { :root { --sz: 576px; } }
    @media (max-width: 480px)  { :root { --sz: 322px; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-family: system-ui, sans-serif; cursor: none;
    }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    canvas {
      width: var(--sz); height: var(--sz);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); display: block;
    }
    #meta { display: flex; align-items: center; gap: 24px; }
    #label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="meta">
      <span id="label">orbit — move + click</span>
    </div>
  </div>
<script>
  const SZ = 422;
  const canvas = document.getElementById('c');
  canvas.width = canvas.height = SZ;
  const ctx = canvas.getContext('2d');

  // ── Physics constants ─────────────────────────────────────────
  const G         = 780000; // px³/s² — gives ~5s orbits at r=80px
  const N         = 90;
  const TRAIL_LEN = 20;
  const MIN_R     = 15;     // singularity clamp
  const CLICK_STR = 12000;  // radial impulse strength

  let mx = SZ/2, my = SZ/2, isInside = false;

  // ── Particles ─────────────────────────────────────────────────
  const particles = [];

  function spawn(gx, gy) {
    const r    = 35 + Math.random() * 150;
    const ang  = Math.random() * Math.PI * 2;
    const x    = gx + Math.cos(ang) * r;
    const y    = gy + Math.sin(ang) * r;
    const orbV = Math.sqrt(G / r) * (0.80 + Math.random() * 0.40);
    const cw   = Math.random() < 0.22 ? -1 : 1;
    particles.push({
      x, y,
      vx: -Math.sin(ang) * orbV * cw + (Math.random()-0.5) * 12,
      vy:  Math.cos(ang) * orbV * cw + (Math.random()-0.5) * 12,
      trail: [],
    });
  }

  for (let i = 0; i < N; i++) spawn(SZ/2, SZ/2);

  // ── Events ───────────────────────────────────────────────────
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mx = (e.clientX - r.left) * (SZ / r.width);
    my = (e.clientY - r.top)  * (SZ / r.height);
    isInside = true;
  });
  canvas.addEventListener('mouseenter', () => isInside = true);
  canvas.addEventListener('mouseleave', () => isInside = false);

  canvas.addEventListener('pointerdown', e => {
    const r  = canvas.getBoundingClientRect();
    const ex = (e.clientX - r.left) * (SZ / r.width);
    const ey = (e.clientY - r.top)  * (SZ / r.height);
    particles.forEach(p => {
      const dx = p.x - ex, dy = p.y - ey;
      const d  = Math.sqrt(dx*dx + dy*dy) + 1;
      const imp = CLICK_STR / d;
      p.vx += (dx/d) * imp;
      p.vy += (dy/d) * imp;
    });
    playClick();
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    mx = (t.clientX - r.left) * (SZ / r.width);
    my = (t.clientY - r.top)  * (SZ / r.height);
    isInside = true;
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    mx = (t.clientX - r.left) * (SZ / r.width);
    my = (t.clientY - r.top)  * (SZ / r.height);
  }, { passive: false });
  canvas.addEventListener('touchend', () => isInside = false);

  // ── Update ───────────────────────────────────────────────────
  function update(dt) {
    const gx = isInside ? mx : SZ/2;
    const gy = isInside ? my : SZ/2;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p  = particles[i];
      const dx = gx - p.x, dy = gy - p.y;
      const d  = Math.max(Math.sqrt(dx*dx + dy*dy), MIN_R);
      const acc = G / (d * d);

      p.vx += (dx/d) * acc * dt;
      p.vy += (dy/d) * acc * dt;
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;

      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > TRAIL_LEN) p.trail.shift();

      if (p.x < -SZ || p.x > SZ*2 || p.y < -SZ || p.y > SZ*2) {
        particles.splice(i, 1);
        spawn(gx, gy);
      }
    }
  }

  // ── Draw ─────────────────────────────────────────────────────
  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SZ, SZ);

    const gx = isInside ? mx : SZ/2;
    const gy = isInside ? my : SZ/2;

    // Gravity well glow
    const grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, 44);
    grd.addColorStop(0,    'rgba(255,255,255,0.13)');
    grd.addColorStop(0.45, 'rgba(255,255,255,0.04)');
    grd.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(gx, gy, 44, 0, Math.PI*2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Particles + trails
    particles.forEach(p => {
      const len = p.trail.length;
      for (let j = 0; j < len; j++) {
        const frac = j / len;
        const pt   = p.trail[j];
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 0.5 + frac * 0.9, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${(frac * frac * 0.40).toFixed(3)})`;
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.8, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.fill();
    });

    // Gravity source dot
    ctx.beginPath();
    ctx.arc(gx, gy, 2.5, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fill();
  }

  // ── Audio ────────────────────────────────────────────────────
  let clickAudio = null;
  function initAudio() {
    if (clickAudio) return;
    clickAudio = new Audio('./sounds/selection.mp3');
    clickAudio.volume = 0.42;
  }
  function playClick() {
    initAudio();
    clickAudio.currentTime = 0;
    clickAudio.play().catch(() => {});
  }

  // ── Loop ─────────────────────────────────────────────────────
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
