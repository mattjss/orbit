<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>orbit</title>
  <style>
    :root { --sz: 422px; }
    @media (min-width: 1440px) { :root { --sz: 576px; } }
    @media (max-width: 480px)  { :root { --sz: 322px; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-family: system-ui, sans-serif; cursor: none;
    }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    canvas {
      width: var(--sz); height: var(--sz);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); display: block;
    }
    #meta { display: flex; align-items: center; gap: 24px; }
    #label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="meta">
      <span id="label">orbit — move + click</span>
    </div>
  </div>
<script>
  const SZ = 422;
  const canvas = document.getElementById('c');
  canvas.width = canvas.height = SZ;
  const ctx = canvas.getContext('2d');

  let cx = SZ / 2, cy = SZ / 2;
  let cvx = 0, cvy = 0;
  let mx = SZ / 2, my = SZ / 2, isInside = false;

  const RINGS = [
    { r: 38,  n: 7,  spd:  0.022, alpha: 0.75 },
    { r: 72,  n: 12, spd: -0.014, alpha: 0.52 },
    { r: 112, n: 18, spd:  0.009, alpha: 0.34 },
    { r: 155, n: 24, spd: -0.006, alpha: 0.20 },
  ];

  const particles = [];
  RINGS.forEach((ring, ri) => {
    for (let i = 0; i < ring.n; i++) {
      particles.push({ ri, angle: (i / ring.n) * Math.PI * 2, r: ring.r, vr: 0, va: 0 });
    }
  });

  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mx = (e.clientX - r.left) * (SZ / r.width);
    my = (e.clientY - r.top)  * (SZ / r.height);
    isInside = true;
    maybeTick(e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseenter', () => isInside = true);
  canvas.addEventListener('mouseleave', () => isInside = false);

  canvas.addEventListener('pointerdown', () => {
    particles.forEach(p => {
      p.vr += 4 + Math.random() * 3;
      p.va += (Math.random() - 0.5) * 0.04;
    });
    playClick();
  });

  function update() {
    const tx = isInside ? mx : SZ / 2;
    const ty = isInside ? my : SZ / 2;
    cvx += (tx - cx) * 0.055;
    cvy += (ty - cy) * 0.055;
    cvx *= 0.82; cvy *= 0.82;
    cx += cvx; cy += cvy;

    particles.forEach(p => {
      const ring = RINGS[p.ri];
      p.angle += ring.spd + p.va;
      p.va *= 0.92;
      p.vr += (ring.r - p.r) * 0.12;
      p.vr *= 0.78;
      p.r += p.vr;
      p.r = Math.max(p.r, 2);
    });
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SZ, SZ);

    RINGS.forEach(ring => {
      ctx.beginPath();
      ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    particles.forEach(p => {
      const ring = RINGS[p.ri];
      const px = cx + Math.cos(p.angle) * p.r;
      const py = cy + Math.sin(p.angle) * p.r;
      const disp = Math.abs(p.r - ring.r);
      const alpha = ring.alpha + Math.min(disp / 20, 1) * 0.3;
      const radius = 1.5 + Math.min(disp / 30, 1) * 1.0;
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${Math.min(alpha, 0.95).toFixed(3)})`;
      ctx.fill();
    });

    ctx.beginPath();
    ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();

    if (isInside) {
      const dx = mx - cx, dy = my - cy;
      if (Math.sqrt(dx * dx + dy * dy) > 8) {
        ctx.beginPath();
        ctx.arc(mx, my, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fill();
      }
    }
  }

  // ── Audio ─────────────────────────────────────────────────────
  let AC;
  function ac() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }

  let _revBuf = null;
  function getRevBuf(a) {
    if (_revBuf) return _revBuf;
    const len = Math.floor(a.sampleRate * 1.8);
    _revBuf = a.createBuffer(2, len, a.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = _revBuf.getChannelData(ch);
      for (let i = 0; i < len; i++)
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    return _revBuf;
  }

  let lastTick = { x: 0, y: 0 }, lastTickT = 0;
  function maybeTick(x, y) {
    const dx = x - lastTick.x, dy = y - lastTick.y;
    if (dx * dx + dy * dy < 22 * 22) return;
    lastTick = { x, y };
    try {
      const a = ac(), t = a.currentTime;
      if (t - lastTickT < 0.06) return;
      lastTickT = t;
      // FM orbital scan — proximity to nucleus raises pitch
      const distFromCenter = Math.sqrt((mx - cx) * (mx - cx) + (my - cy) * (my - cy));
      const tFrac = Math.max(0, 1 - distFromCenter / 185);
      const freq = 110 + tFrac * 290;
      const mod = a.createOscillator(), modG = a.createGain();
      const osc = a.createOscillator(), outG = a.createGain();
      mod.frequency.value = freq * 1.618;
      modG.gain.value = freq * 0.42;
      mod.connect(modG); modG.connect(osc.frequency);
      osc.type = 'sine'; osc.frequency.value = freq;
      osc.connect(outG); outG.connect(a.destination);
      outG.gain.setValueAtTime(0.001, t);
      outG.gain.linearRampToValueAtTime(0.026, t + 0.025);
      outG.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
      mod.start(t); osc.start(t);
      mod.stop(t + 0.35); osc.stop(t + 0.35);
    } catch (_) {}
  }

  function playClick() {
    try {
      const a = ac(), t = a.currentTime;

      // Convolution reverb — space and depth
      const conv = a.createConvolver();
      conv.buffer = getRevBuf(a);
      const convG = a.createGain(); convG.gain.value = 0.26;
      conv.connect(convG); convG.connect(a.destination);

      // Sub gravity pulse — the weight of orbital collapse
      const sub = a.createOscillator(), subG = a.createGain();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(44, t);
      sub.frequency.exponentialRampToValueAtTime(16, t + 0.52);
      sub.connect(subG); subG.connect(a.destination);
      subG.gain.setValueAtTime(0.001, t);
      subG.gain.linearRampToValueAtTime(0.34, t + 0.008);
      subG.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      sub.start(t); sub.stop(t + 0.56);

      // FM field voices — harmonic activation through reverb
      [55, 82, 110, 164].forEach((freq, i) => {
        const d = i * 0.03;
        const mod = a.createOscillator(), modG = a.createGain();
        const carrier = a.createOscillator(), outG = a.createGain();
        mod.frequency.value = freq * 2.414;
        modG.gain.value = freq * (1.1 - i * 0.18);
        mod.connect(modG); modG.connect(carrier.frequency);
        carrier.type = 'sine'; carrier.frequency.value = freq;
        carrier.connect(outG);
        outG.connect(conv);
        outG.connect(a.destination);
        const pk = 0.052 - i * 0.009;
        outG.gain.setValueAtTime(0.001, t + d);
        outG.gain.linearRampToValueAtTime(pk, t + d + 0.022);
        outG.gain.exponentialRampToValueAtTime(0.001, t + d + 0.88);
        mod.start(t + d); carrier.start(t + d);
        mod.stop(t + d + 0.89); carrier.stop(t + d + 0.89);
      });

      // Particle scatter — resonant bandpass noise sweep
      const nLen = Math.floor(a.sampleRate * 0.14);
      const nBuf = a.createBuffer(1, nLen, a.sampleRate);
      const nd = nBuf.getChannelData(0);
      for (let i = 0; i < nLen; i++)
        nd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (nLen * 0.22));
      const nSrc = a.createBufferSource(); nSrc.buffer = nBuf;
      const nFlt = a.createBiquadFilter(); nFlt.type = 'bandpass';
      nFlt.frequency.setValueAtTime(600, t);
      nFlt.frequency.exponentialRampToValueAtTime(3800, t + 0.12);
      nFlt.Q.value = 1.8;
      const nG = a.createGain(); nG.gain.value = 0.2;
      nSrc.connect(nFlt); nFlt.connect(nG); nG.connect(a.destination);
      nSrc.start(t);
    } catch (_) {}
  }

  (function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
